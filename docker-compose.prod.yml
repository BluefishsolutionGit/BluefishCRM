# Production stack for a Hostinger VPS (or any Docker host).
#
# Layout:
#   postgres  — dedicated DB for CRM (see docs/DEPLOY.md for the "share
#               existing Postgres" alternative)
#   api       — NestJS backend, auto-migrates on start
#   web       — SPA served by Nginx
#   caddy     — TLS terminator + reverse proxy in front of web + api
#
# Run:      docker compose -f docker-compose.prod.yml up -d --build
# Migrate:  auto on api start (prisma migrate deploy)
# Backups:  see docs/DEPLOY.md § Backups
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bluefish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-bluefish_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: bind-mount a host-side backup dir for pg_dump crons.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Compose the DATABASE_URL from the pieces above so ops never has to
      # remember to update two places when the password changes.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluefish}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bluefish_crm}
      NODE_ENV: production
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin: the reverse proxy routes /api → api container.
        # If you host web + api on different domains, change this to the
        # absolute API URL (must be set at BUILD time — Vite inlines it).
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy-data:
  caddy-config:
