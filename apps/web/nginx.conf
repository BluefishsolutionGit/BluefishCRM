server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the fingerprinted Vite assets — index.html itself must never
  # be cached so the fresh manifest reaches the browser after every deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback — every route not matching a real file returns index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain application/javascript application/json application/xml application/xml+rss text/css text/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;
}
